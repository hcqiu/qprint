[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qprint"
version = "0.1.0"
description = "Markdown-first mathematical knowledge graph and proof navigation IDE"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyYAML>=6,<7", "httpx>=0.27,<1", "plasTeX>=3.1,<4", "markdown-it-py>=3,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
qprint = "qprint.__main__:main"

[tool.setuptools.packages.find]
include = ["qprint*"]

[tool.setuptools.package-data]
qprint = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
